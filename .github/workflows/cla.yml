name: CLA

# Asks the author of a pull request to agree to CLA.md once. Signatures are kept in this
# repository on the branch `cla-signatures`.
on:
  issue_comment:
    types: [created]
  pull_request_target:
    types: [opened, closed, synchronize]

permissions:
  actions: write
  contents: write
  pull-requests: write
  statuses: write

jobs:
  cla:
    runs-on: ubuntu-latest
    steps:
      - if: (github.event.comment.body == 'recheck' || github.event.comment.body == 'I have read the CLA Document and I hereby sign the CLA') || github.event_name == 'pull_request_target'
        uses: contributor-assistant/github-action@v2.6.1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          path-to-signatures: signatures/version1/cla.json
          path-to-document: https://github.com/achrista/culinola/blob/main/CLA.md
          branch: cla-signatures
          # The maintainer and automated accounts do not need to sign
          allowlist: achrista,dependabot[bot]
