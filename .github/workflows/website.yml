name: Website

# Publishes the project site (folder `website`) with the live demo to GitHub Pages – culinola.org.
on:
  push:
    branches: [main]
    paths: ['website/**', 'docs/images/**', 'packages/**', 'plugins/**', 'templates/**', 'package-lock.json', '.github/workflows/website.yml']
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      # The live demo: Culinola itself, built to run in the browser under /demo/
      - run: npm run build:demo
      # The site shows the same screenshots as the README
      - run: cp -r docs/images website/images
      - uses: actions/configure-pages@v6
      - uses: actions/upload-pages-artifact@v5
        with:
          path: website
      - id: deployment
        uses: actions/deploy-pages@v5
