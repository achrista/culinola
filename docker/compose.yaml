# Beispiel für den Betrieb mit Docker Compose. Aus diesem Ordner starten:
#
#   docker compose up -d --build
#
# Der Ordner ./data neben dieser Datei nimmt config.json, secrets.json, Rezepte und
# Senderlogos auf. Fehlt config.json, läuft Culinola mit erfundenen Beispielwerten.
services:
  culinola:
    build:
      context: ..
      dockerfile: docker/Dockerfile
    image: culinola:local
    restart: unless-stopped

    # Das Netz des Rechners selbst: Kameras und Fernsehen brauchen eine Bildübertragung,
    # deren Gegenstelle im Heimnetz direkt erreichbar sein muss. Das geht so ohne weitere
    # Einstellung; openHAB auf demselben Rechner ist dann unter localhost erreichbar.
    # Nur unter Linux. Ohne Video genügt stattdessen:  ports: ["8090:8090"]
    network_mode: host

    environment:
      TZ: Europe/Berlin
    volumes:
      - ./data:/data

    # Der Dienst läuft im Abbild als Benutzer 1000. Gehört ./data einem anderen Benutzer,
    # hier dessen Nummern eintragen (id -u und id -g zeigen sie an).
    # user: "1001:1001"

    # Grafikchip für Fernsehbilder (Intel, VAAPI): Ohne ihn rechnet der Prozessor, was auf
    # schwachen Rechnern ruckeln kann. Die Gruppe ist die, der /dev/dri/renderD128 gehört –
    # ls -ln /dev/dri zeigt ihre Nummer (oft "render" oder "video", auf einer Synology "videodriver").
    # devices:
    #   - /dev/dri:/dev/dri
    # group_add:
    #   - "993"
