name = "culinola-ping"
main = "worker.js"
compatibility_date = "2026-10-01"

# Serves https://ping.culinola.org – the domain must be in the same Cloudflare account.
routes = [{ pattern = "ping.culinola.org", custom_domain = true }]

# Daily clean-up: installations silent for a year are deleted
[triggers]
crons = ["30 4 * * *"]

# Request logs would contain IP addresses; the worker keeps none.
[observability]
enabled = false

[[d1_databases]]
binding = "DB"
database_name = "culinola-ping"
# Fill in the id that `npx wrangler d1 create culinola-ping` prints
database_id = "REPLACE_ME"
